name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run lint
      - run: npm run test:unit
      # run.mjs is left out: it presses the real keyboard shortcut and needs a visible window.
      - run: node test/e2e/hints.mjs
      - run: node test/e2e/preview.mjs
