name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      # Ubuntu 23.10+ blocks the user namespaces Chrome's sandbox needs.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run lint
      - run: npm run test:unit
      # run.mjs is left out: it presses the real keyboard shortcut and needs a visible window.
      - run: node test/e2e/hints.mjs
      - run: node test/e2e/preview.mjs
